spring:
  application:
    name: ex04

  datasource:
    url: jdbc:mysql://localhost:3307/springdb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    # data.sql 실행
    defer-datasource-initialization: true
  sql:
    init:
      mode: always